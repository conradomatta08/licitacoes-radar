name: Backfill histórico (Compras.gov.br)

on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar backfill (arquivo anual, filtrado pela janela de histórico)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python run_backfill.py
